<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WealthPulse Local - Portfolio Ledger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .currency-input-wrapper {
            position: relative;
            display: inline-flex;
            align-items: center;
            width: 100%;
        }
        .currency-input-wrapper span {
            position: absolute;
            left: 0.5rem;
            color: #94a3b8;
            font-weight: 700;
            font-size: 0.75rem;
            pointer-events: none;
        }
        .currency-input-wrapper input {
            padding-left: 1.2rem;
            width: 100%;
        }
        /* Custom Tooltip Animation */
        .tooltip-enter {
            opacity: 0;
            transform: translateY(5px) translateX(-50%);
        }
        .tooltip-active {
            opacity: 1;
            transform: translateY(0) translateX(-50%);
            transition: opacity 0.2s, transform 0.2s;
        }
        /* Toggle Switch */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #10b981;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #10b981;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 selection:bg-blue-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useRef, useEffect } = React;
        const { createPortal } = ReactDOM;

        // --- Icons ---
        const Icon = ({ name, size = 24, className = "" }) => {
            const icons = {
                Plus: <path d="M5 12h14m-7-7v14" />,
                ChevronDown: <path d="m6 9 6 6 6-6" />,
                ChevronUp: <path d="m18 15-6-6-6 6" />,
                BarChart3: <path d="M3 3v18h18M18 17V9M13 17V5M8 17v-3" />,
                TrendingUp: <path d="m22 7-8.5 8.5L8 10l-6 6" />,
                Sprout: <path d="M7 20h10M10 20c0-3 1-7 5-7 2 0 3 1 3 3 0 3-5 5-5 5M14 20c0-3-1-7-5-7-2 0-3 1-3 3 0 3 5 5 5 5" />,
                PiggyBank: <path d="M19 5c-1.5 0-2.8 1.4-3 2-3.5-1.5-11-.3-11 5 0 1.8 0 3 2 4.5V20h4v-2h3v2h4v-4c1-.5 1.7-1 2-2h2v-4h-2c0-1-.5-1.5-1-2h0V5Z" />,
                Calendar: <path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z" />,
                Download: <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3" />,
                Upload: <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12" />,
                ShieldCheck: <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10zM9 12l2 2 4-4" />,
                Activity: <path d="M22 12h-4l-3 9L9 3l-3 9H2" />,
                Percent: <path d="M19 5 5 19M6.5 9a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5ZM17.5 20a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z" />,
                Trash2: <path d="M3 6h18m-2 0v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6m3 0V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2M10 11v6M14 11v6" />,
                Info: <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10zm0-7V11m0-4h.01" />,
                X: <path d="M18 6 6 18M6 6l12 12" />,
                CheckCircle2: <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10zm-1.5-6L7 12.5l1.5-1.5 2 2 5-5 1.5 1.5-6.5 6.5z" />,
                AlertCircle: <path d="M12 8v4m0 4h.01M22 12c0 5.523-4.477 10-10 10S2 17.523 2 12 6.477 2 12 2s10 4.477 10 10z" />,
                ArrowUpRight: <path d="M7 17L17 7M17 7H7M17 7V17" />,
                Layers: <g><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z" /><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65" /><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65" /></g>,
                Minus: <path d="M5 12h14" />,
                Sliders: <g><line x1="4" x2="4" y1="21" y2="14" /><line x1="4" x2="4" y1="10" y2="3" /><line x1="12" x2="12" y1="21" y2="12" /><line x1="12" x2="12" y1="8" y2="3" /><line x1="20" x2="20" y1="21" y2="16" /><line x1="20" x2="20" y1="12" y2="3" /><line x1="1" x2="7" y1="14" y2="14" /><line x1="9" x2="15" y1="8" y2="8" /><line x1="17" x2="23" y1="16" y2="16" /></g>,
                Sparkles: <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z" />,
                Wallet: <g><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4" /><path d="M3 5v14a2 2 0 0 0 2 2h16v-5" /><path d="M18 12a2 2 0 0 0 0 4h4v-4Z" /></g>,
                History: <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8m0 0V4m0 4h4" />
            };

            return (
                <svg 
                    xmlns="http://www.w3.org/2000/svg" 
                    width={size} 
                    height={size} 
                    viewBox="0 0 24 24" 
                    fill="none" 
                    stroke="currentColor" 
                    strokeWidth="2" 
                    strokeLinecap="round" 
                    strokeLinejoin="round" 
                    className={className}
                >
                    {icons[name]}
                </svg>
            );
        };

        const Tooltip = ({ text, content }) => {
            const [visible, setVisible] = useState(false);
            const body = content || text;
            return (
                <span className="relative inline-flex items-center" style={{verticalAlign: 'middle'}}>
                    <button
                        onMouseEnter={() => setVisible(true)}
                        onMouseLeave={() => setVisible(false)}
                        onFocus={() => setVisible(true)}
                        onBlur={() => setVisible(false)}
                        className="text-slate-300 hover:text-slate-500 transition-colors ml-1 focus:outline-none"
                        tabIndex={-1}
                        type="button"
                    >
                        <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                            <circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>
                        </svg>
                    </button>
                    {visible && (
                        <span className="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 w-52 bg-slate-800 text-white text-[10px] font-medium leading-relaxed rounded-lg px-3 py-2 shadow-xl z-50 pointer-events-none normal-case tracking-normal">
                            {body}
                            <span className="absolute top-full left-1/2 -translate-x-1/2 border-4 border-transparent border-t-slate-800" />
                        </span>
                    )}
                </span>
            );
        };

        const App = () => {
            const [expandedYears, setExpandedYears] = useState({});
            const [hoveredNode, setHoveredNode] = useState(null);
            const [hoveredHistNode, setHoveredHistNode] = useState(null);
            const [inflationBaseYear, setInflationBaseYear] = useState(null);
            const [spendableBaseYear, setSpendableBaseYear] = useState('nominal');
            const [viewMode, setViewMode] = useState('linear'); 
            const [showDrawdown, setShowDrawdown] = useState(false);
            const [compViewMode, setCompViewMode] = useState('growth'); 
            const [useAccountTaxProfile, setUseAccountTaxProfile] = useState(true);
            const [graphAccountFilter, setGraphAccountFilter] = useState('all');
            const [lifetimeAccountFilter, setLifetimeAccountFilter] = useState('all');
            const [deletedAccount, setDeletedAccount] = useState(null);
            const undoTimerRef = useRef(null);
            const [confirmingDelete, setConfirmingDelete] = useState(null);
            const fileInputRef = useRef(null);

            const [data, setData] = useState({
                retirementGoal: 1000000,
                retirementYear: 2060,
                retirementDuration: 30,
                monthlyContrib: 1500,
                annualRetirementSpend: 80000,
                annualRetirementIncome: 30000,
                estPreRetirementReturn: 7.0,
                estPostRetirementReturn: 5.0,
                estInflation: 2.5,
                estIncomeTax: 20.0,
                estCapGainsTax: 15.0,
                safeWithdrawalRate: 4.0,
                manualNestEgg: null,
                years: [
                    {
                        id: 'initial-year-id',
                        year: 2024,
                        inflationRate: 3.0,
                        grossIncome: 0,
                        accounts: [
                            { id: '1', name: '401(k)', begBalance: 100000, persContrib: 10000, empContrib: 5000, endBalance: 125000, type: 'Pre-Tax', rothSplit: 0 },
                            { id: '2', name: 'Roth IRA', begBalance: 25000, persContrib: 7000, empContrib: 0, endBalance: 35000, type: 'Roth', rothSplit: 0 }
                        ]
                    }
                ]
            });

            // --- Formatters ---
            const formatCurrency = (val) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(val || 0);
            const formatNum = (val) => new Intl.NumberFormat('en-US', { maximumFractionDigits: 0 }).format(val || 0);
            const formatShort = (val) => {
                const absVal = Math.abs(val);
                const sign = val < 0 ? '-' : '';
                if (absVal >= 1000000) return sign + '$' + (absVal / 1000000).toFixed(1) + 'M';
                if (absVal >= 1000) return sign + '$' + (absVal / 1000).toFixed(0) + 'k';
                return sign + '$' + Math.round(absVal).toLocaleString();
            };
            const formatRaw = (val) => val === null || val === undefined ? "" : val.toString();

            // Extract unique account names for filters
            const uniqueAccountNames = useMemo(() => {
                const names = new Set();
                data.years.forEach(y => y.accounts.forEach(a => { if(a.name) names.add(a.name); }));
                return Array.from(names).sort();
            }, [data.years]);

            // Update year data helper
            const updateYearData = (yearId, field, value) => {
                setData(prev => ({
                    ...prev,
                    years: prev.years.map(y => y.id === yearId ? { ...y, [field]: value } : y)
                }));
            };

            // Helper for calculations
            const calculateYearMetrics = (yearData) => {
                const totalBeg = (yearData.accounts || []).reduce((sum, a) => sum + Number(a.begBalance || 0), 0);
                const totalPers = (yearData.accounts || []).reduce((sum, a) => sum + Number(a.persContrib || 0), 0);
                const totalEmp = (yearData.accounts || []).reduce((sum, a) => sum + Number(a.empContrib || 0), 0);
                const totalEnd = (yearData.accounts || []).reduce((sum, a) => sum + Number(a.endBalance || 0), 0);
                const totalSaved = totalPers + totalEmp;
                const marketGrowth = totalEnd - (totalBeg + totalSaved);
                const nominalReturn = (totalBeg + (totalSaved / 2)) === 0 ? 0 : marketGrowth / (totalBeg + (totalSaved / 2));
                const inflation = Number(yearData.inflationRate || 0) / 100;
                const realReturn = ((1 + nominalReturn) / (1 + inflation)) - 1;
                const savingsRate = Number(yearData.grossIncome) > 0 ? (totalSaved / Number(yearData.grossIncome)) * 100 : 0;
                const averageCapital = totalBeg + (totalSaved / 2);

                return { totalBeg, totalPers, totalEmp, totalSaved, marketGrowth, totalEnd, nominalReturn, realReturn, inflation, savingsRate, averageCapital };
            };

            // Calculate metrics for all years
            const processedYearData = useMemo(() => {
                const sortedAsc = [...data.years].sort((a, b) => Number(a.year) - Number(b.year));
                
                const withRealValues = sortedAsc.map(yearData => {
                    const metrics = calculateYearMetrics(yearData);

                    return { ...yearData, metrics };
                });

                return withRealValues.reverse();
            }, [data.years]);

            // Lifetime Metrics (Filtered)
            const lifetimeMetrics = useMemo(() => {
                let totalCapitalAtRisk = 0;
                let weightedRealReturnSum = 0;
                let weightedNominalReturnSum = 0;
                let sumInflation = 0;

                const totals = data.years.reduce((acc, y) => {
                    // Filter accounts based on lifetimeAccountFilter
                    const accountsToUse = lifetimeAccountFilter === 'all' 
                        ? y.accounts 
                        : y.accounts.filter(a => a.name === lifetimeAccountFilter);
                    
                    const tBeg = accountsToUse.reduce((sum, a) => sum + Number(a.begBalance || 0), 0);
                    const tPers = accountsToUse.reduce((sum, a) => sum + Number(a.persContrib || 0), 0);
                    const tEmp = accountsToUse.reduce((sum, a) => sum + Number(a.empContrib || 0), 0);
                    const tEnd = accountsToUse.reduce((sum, a) => sum + Number(a.endBalance || 0), 0);
                    const tSaved = tPers + tEmp;
                    const mGrowth = tEnd - (tBeg + tSaved);
                    
                    const avgCap = tBeg + (tSaved / 2);
                    const nomRet = avgCap === 0 ? 0 : mGrowth / avgCap;
                    const inf = Number(y.inflationRate || 0) / 100;
                    const realRet = ((1 + nomRet) / (1 + inf)) - 1;

                    acc.totalSaved += tSaved;
                    acc.totalPers += tPers;
                    acc.totalEmp += tEmp;
                    acc.totalGrowth += mGrowth;
                    
                    sumInflation += (y.inflationRate || 0);

                    if (avgCap > 0) {
                        weightedRealReturnSum += realRet * avgCap;
                        weightedNominalReturnSum += nomRet * avgCap;
                        totalCapitalAtRisk += avgCap;
                    }
                    
                    return acc;
                }, { totalSaved: 0, totalPers: 0, totalEmp: 0, totalGrowth: 0, sumRealReturn: 0 });

                const count = data.years.length || 1;
                const sortedYears = [...data.years].sort((a, b) => a.year - b.year);
                const baseYear = inflationBaseYear ? parseInt(inflationBaseYear) : (sortedYears[0]?.year || new Date().getFullYear());
                
                let cumulativeInflation = 1.0;
                sortedYears.forEach(y => {
                    if (y.year >= baseYear) {
                         cumulativeInflation *= (1 + (y.inflationRate || 0) / 100);
                    }
                });
                const totalCumulativeInflation = (cumulativeInflation - 1);
                const avgInflation = count > 0 ? (sumInflation / count) / 100 : 0;
                const avgRealReturn = totalCapitalAtRisk > 0 ? weightedRealReturnSum / totalCapitalAtRisk : 0;
                const avgNominalReturn = totalCapitalAtRisk > 0 ? weightedNominalReturnSum / totalCapitalAtRisk : 0;

                return { ...totals, avgRealReturn, avgNominalReturn, avgInflation, totalCumulativeInflation, baseYear };
            }, [data.years, inflationBaseYear, lifetimeAccountFilter]);

            // Historical Data for Charts (Filtered)
            const historicalChartData = useMemo(() => {
                const chronological = [...processedYearData].reverse();
                let runningPrincipal = 0;
                let isFirst = true;

                const dataPoints = chronological.map((y) => {
                     const accountsToUse = graphAccountFilter === 'all' 
                        ? y.accounts 
                        : y.accounts.filter(a => a.name === graphAccountFilter);
                    
                    const tBeg = accountsToUse.reduce((sum, a) => sum + Number(a.begBalance || 0), 0);
                    const tSaved = accountsToUse.reduce((sum, a) => sum + (Number(a.persContrib || 0) + Number(a.empContrib || 0)), 0);
                    const tEnd = accountsToUse.reduce((sum, a) => sum + Number(a.endBalance || 0), 0);

                    if (isFirst) {
                        runningPrincipal = tBeg;
                        isFirst = false;
                    }
                    runningPrincipal += tSaved;
                    const marketValue = Math.max(0, tEnd - runningPrincipal);
                    
                    // Tax Allocations
                    let preTax = 0;
                    let roth = 0;
                    let taxable = 0;
                    let realEstate = 0;

                    accountsToUse.forEach(acc => {
                        const bal = Number(acc.endBalance || 0);
                        if (acc.type === 'Roth') roth += bal;
                        else if (acc.type === 'Taxable') taxable += bal;
                        else if (acc.type === 'Real Estate') realEstate += bal;
                        else if (acc.type === 'Hybrid') {
                             const split = parseFloat(acc.rothSplit || 0);
                             roth += bal * (split / 100);
                             preTax += bal * (1 - (split / 100));
                        }
                        else preTax += bal;
                    });

                    return {
                        year: y.year,
                        principal: runningPrincipal,
                        growth: marketValue,
                        total: tEnd,
                        preTax,
                        roth,
                        taxable,
                        realEstate,
                        change: 0,
                        changePercent: 0
                    };
                });

                for (let i = 1; i < dataPoints.length; i++) {
                    const prev = dataPoints[i-1];
                    const curr = dataPoints[i];
                    const diff = curr.total - prev.total;
                    curr.change = diff;
                    curr.changePercent = prev.total !== 0 ? (diff / prev.total) * 100 : 0;
                }
                return dataPoints;
            }, [processedYearData, graphAccountFilter]);

            const latestActualValue = useMemo(() => {
                if (processedYearData.length === 0) return 0;
                return processedYearData[0].metrics.totalEnd;
            }, [processedYearData]);

            const currentNestEgg = data.manualNestEgg !== null ? data.manualNestEgg : latestActualValue;

            // --- SPENDABLE NET WORTH CALCULATION ---
            const spendableMetrics = useMemo(() => {
                const sortedYears = [...data.years].sort((a, b) => Number(b.year) - Number(a.year));
                if (sortedYears.length === 0) return { spendable: 0, nominal: 0, taxDragRatio: 0 };

                const latestYear = sortedYears[0];
                let spendableTotal = 0;
                let nominalTotal = 0; // Nominal total of LIQUID assets only for ratio calc

                // Build per-account growth ratio for Taxable accounts
                // Tracks each account's own contribution and balance history
                // so cap gains tax is only applied to that account's actual gains
                const accountGrowthRatios = {};
                const chronYearsForGrowth = [...data.years].sort((a, b) => Number(a.year) - Number(b.year));
                
                chronYearsForGrowth.forEach((y, yearIndex) => {
                    (y.accounts || []).forEach(acc => {
                        if (acc.type !== 'Taxable') return;
                        const name = acc.name;
                        if (!accountGrowthRatios[name]) {
                            // First year we see this account — seed with its beginning balance as principal
                            accountGrowthRatios[name] = { principal: Number(acc.begBalance || 0) };
                        }
                        // Add this year's contributions to the running principal
                        accountGrowthRatios[name].principal += Number(acc.persContrib || 0) + Number(acc.empContrib || 0);
                        // Record end balance for this year
                        accountGrowthRatios[name].endBalance = Number(acc.endBalance || 0);
                    });
                });

                // Convert to growth ratio per account name
                const taxableGrowthRatio = (accountName) => {
                    const acct = accountGrowthRatios[accountName];
                    if (!acct || acct.endBalance <= 0) return 0;
                    const gain = Math.max(0, acct.endBalance - acct.principal);
                    return gain / acct.endBalance;
                };

                (latestYear.accounts || []).forEach(acc => {
                    const bal = Number(acc.endBalance || 0);
                    
                    if (acc.type === 'Real Estate') return; // EXCLUDE REAL ESTATE FROM SPENDABLE

                    nominalTotal += bal;
                    
                    if (useAccountTaxProfile) {
                        if (acc.type === 'Roth') {
                            spendableTotal += bal;
                        } else if (acc.type === 'Pre-Tax') {
                            spendableTotal += bal * (1 - (data.estIncomeTax / 100));
                        } else if (acc.type === 'Taxable') {
                            // Use this account's own growth ratio — not the whole portfolio's
                            const gainPortion = bal * taxableGrowthRatio(acc.name);
                            const tax = gainPortion * (data.estCapGainsTax / 100);
                            spendableTotal += (bal - tax);
                        } else if (acc.type === 'Hybrid') {
                             const split = parseFloat(acc.rothSplit || 0);
                             const rothPart = bal * (split / 100);
                             const prePart = bal * (1 - (split / 100));
                             spendableTotal += rothPart + (prePart * (1 - (data.estIncomeTax / 100)));
                        } else {
                             spendableTotal += bal * (1 - (data.estIncomeTax / 100));
                        }
                    } else {
                         spendableTotal += bal * (1 - (data.estIncomeTax / 100));
                    }
                });

                let adjSpendable = spendableTotal;
                if (spendableBaseYear !== 'nominal') {
                    const base = parseInt(spendableBaseYear);
                    const chronYears = [...data.years].sort((a,b) => a.year - b.year);
                    let cumulInflation = 1.0;
                    chronYears.forEach(y => {
                        if (y.year > base) {
                            cumulInflation *= (1 + (y.inflationRate || 0) / 100);
                        }
                    });
                    adjSpendable = spendableTotal / cumulInflation;
                }
                
                // Tax Drag Ratio is based on LIQUID assets only
                const taxDragRatio = nominalTotal > 0 ? (1 - (spendableTotal / nominalTotal)) : 0;

                return { spendable: adjSpendable, nominal: nominalTotal, taxDragRatio };
            }, [data.years, data.estIncomeTax, data.estCapGainsTax, historicalChartData, spendableBaseYear, useAccountTaxProfile, processedYearData]);

             const forecastResults = useMemo(() => {
                const currentYear = new Date().getFullYear();
                const targetYear = data.retirementYear || 2060;
                const realRatePre = ((1 + Number(data.estPreRetirementReturn !== undefined ? data.estPreRetirementReturn : 7.0) / 100) / (1 + Number(data.estInflation || 0) / 100)) - 1;
                const realRatePost = ((1 + Number(data.estPostRetirementReturn !== undefined ? data.estPostRetirementReturn : 5.0) / 100) / (1 + Number(data.estInflation || 0) / 100)) - 1;
                
                const P = Number(currentNestEgg || 0); 
                const PMT = Number(data.monthlyContrib || 0) * 12;
                const target = Number(data.retirementGoal || 0);
                
                const annualSpend = Number(data.annualRetirementSpend || 0);
                const annualIncome = Number(data.annualRetirementIncome || 0);
                const netAnnualSpend = annualSpend - annualIncome;
                const effectiveTaxRate = spendableMetrics.taxDragRatio; 
                const grossAnnualWithdrawal = netAnnualSpend > 0 ? netAnnualSpend / (1 - effectiveTaxRate) : 0;
                
                const retDuration = Number(data.retirementDuration || 30);
                
                const yearsToTargetDate = Math.max(1, targetYear - currentYear);
                let requiredMonthlyReal = 0;
                
                const fvCurrentAssets = P * Math.pow(1 + realRatePre, yearsToTargetDate);
                const gap = target - fvCurrentAssets;
                if (gap > 0) {
                    const annuityFactor = realRatePre === 0 ? yearsToTargetDate : (Math.pow(1 + realRatePre, yearsToTargetDate) - 1) / realRatePre;
                    requiredMonthlyReal = (gap / annuityFactor) / 12;
                }

                let projectedYearReachedRaw = null;
                if (P >= target) {
                    projectedYearReachedRaw = currentYear;
                } else if (PMT > 0 || realRatePre > 0) {
                    if (realRatePre <= 0 && PMT <= 0) projectedYearReachedRaw = null;
                    else if (realRatePre === 0) {
                        const yearsNeeded = (target - P) / PMT;
                        projectedYearReachedRaw = currentYear + Math.ceil(yearsNeeded);
                    } else {
                        const numerator = target * realRatePre + PMT;
                        const denominator = P * realRatePre + PMT;
                        if (numerator > 0 && denominator > 0) {
                            const yearsNeeded = Math.log(numerator / denominator) / Math.log(1 + realRatePre);
                            projectedYearReachedRaw = currentYear + Math.ceil(yearsNeeded);
                        } else projectedYearReachedRaw = null;
                    }
                }
                const projectedYearReachedStr = projectedYearReachedRaw === null ? "Never" : projectedYearReachedRaw.toString();
                
                const financialProgress = target > 0 ? (P / target) * 100 : 0;
                const fvAtTargetDate = realRatePre === 0 ? P + (PMT * yearsToTargetDate) : P * Math.pow(1 + realRatePre, yearsToTargetDate) + PMT * ((Math.pow(1 + realRatePre, yearsToTargetDate) - 1) / realRatePre);

                let statusLabel = "N/A";
                let statusColor = "text-slate-400 bg-slate-100";
                let statusIcon = "Info";

                if (projectedYearReachedRaw) {
                    const yearDiff = Math.abs(projectedYearReachedRaw - targetYear);
                    if (projectedYearReachedRaw < targetYear) {
                        statusLabel = `${yearDiff} Year${yearDiff === 1 ? '' : 's'} Ahead`;
                        statusColor = "text-emerald-700 bg-emerald-100 border-emerald-200";
                        statusIcon = "ArrowUpRight";
                    } else if (projectedYearReachedRaw === targetYear) {
                        statusLabel = "On Track";
                        statusColor = "text-blue-700 bg-blue-100 border-blue-200";
                        statusIcon = "CheckCircle2";
                    } else {
                        statusLabel = `${yearDiff} Year${yearDiff === 1 ? '' : 's'} Behind`;
                        statusColor = "text-rose-700 bg-rose-100 border-rose-200";
                        statusIcon = "AlertCircle";
                    }
                }
                
                const graphPoints = [];
                const graphStartYear = currentYear;
                const graphEndYear = showDrawdown ? targetYear + retDuration : targetYear + 5;
                
                let projBal = P;
                let targetBal = P;
                let idealPMT = 0;
                if (realRatePre !== 0) {
                     idealPMT = (target - P * Math.pow(1+realRatePre, yearsToTargetDate)) / ((Math.pow(1+realRatePre, yearsToTargetDate)-1)/realRatePre);
                }
                let requiredAnnual = idealPMT;

                if (viewMode === 'linear') {
                    for (let y = graphStartYear; y <= graphEndYear; y++) {
                        const point = { year: y, ideal: null, projected: null };
                        
                        if (y === graphStartYear) {
                             point.ideal = P;
                             point.projected = P;
                        } else {
                             if (y <= targetYear) {
                                 if (realRatePre === 0) {
                                     targetBal += requiredAnnual;
                                     projBal += PMT;
                                 } else {
                                     targetBal = targetBal * (1 + realRatePre) + requiredAnnual;
                                     projBal = projBal * (1 + realRatePre) + PMT;
                                 }
                             } else {
                                 if (showDrawdown) {
                                     if (realRatePost === 0) {
                                        targetBal -= grossAnnualWithdrawal;
                                        projBal -= grossAnnualWithdrawal;
                                     } else {
                                        targetBal = targetBal * (1 + realRatePost) - grossAnnualWithdrawal;
                                        projBal = projBal * (1 + realRatePost) - grossAnnualWithdrawal;
                                     }
                                     if (targetBal < 0) targetBal = 0;
                                     if (projBal < 0) projBal = 0;
                                 } else {
                                      if (realRatePre === 0) {
                                        targetBal += requiredAnnual;
                                        projBal += PMT;
                                     } else {
                                        targetBal = targetBal * (1 + realRatePre) + requiredAnnual;
                                        projBal = projBal * (1 + realRatePre) + PMT;
                                     }
                                 }
                             }
                             
                             point.ideal = targetBal;
                             point.projected = projBal;
                        }
                        graphPoints.push(point);
                    }
                }
                
                let successRate = 0;
                let medianOutcome = 0;
                let safeOutcome = 0;
                let optimisticOutcome = 0;
                let monteCarloPoints = [];

                if (viewMode === 'simulation') {
                     // Option B: run entirely in nominal dollars, deflate at end to real terms.
                     // This keeps vol (0.15) and mean return on the same nominal ruler.
                     const nominalRatePre  = Number(data.estPreRetirementReturn  !== undefined ? data.estPreRetirementReturn  : 7.0) / 100;
                     const nominalRatePost = Number(data.estPostRetirementReturn !== undefined ? data.estPostRetirementReturn : 5.0) / 100;
                     const inflationRate   = Number(data.estInflation || 2.5) / 100;
                     const nominalVol = 0.15;

                     // Nominal withdrawal grows with inflation each year
                     const baseWithdrawal = grossAnnualWithdrawal; // already in today's dollars

                     const iterations = 5000;
                     const simYears = showDrawdown ? (targetYear + retDuration) - currentYear : (targetYear + 5) - currentYear;
                     const yearStats = {}; // stores real-deflated balances for chart bands
                     let successCount = 0;

                     // Fix 2: success = reaches >=95% of goal within ±2 years of targetYear
                     const goalThreshold = target * 0.95;

                     for (let i = 0; i < iterations; i++) {
                         let simBal = P; // starts in today's (nominal) dollars
                         let survived = true;
                         let hitGoal = false;
                         let cumulativeInflation = 1.0;

                         for (let t = 1; t <= simYears; t++) {
                             const year = currentYear + t;
                             const isRetired = year > targetYear;
                             const meanReturn = (isRetired && showDrawdown) ? nominalRatePost : nominalRatePre;

                             // Box-Muller normal sample
                             const u1 = Math.random();
                             const u2 = Math.random();
                             const z = Math.sqrt(-2.0 * Math.log(u1)) * Math.cos(2.0 * Math.PI * u2);
                             const annualReturn = meanReturn + (nominalVol * z);

                             cumulativeInflation *= (1 + inflationRate);

                             if (isRetired && showDrawdown) {
                                 // Withdrawal grows with inflation to maintain real spending power
                                 const nominalWithdrawal = baseWithdrawal * cumulativeInflation;
                                 simBal = simBal * (1 + annualReturn) - nominalWithdrawal;
                                 if (simBal < 0) {
                                     simBal = 0;
                                     survived = false;
                                 }
                             } else {
                                 // Contributions grow with inflation (real contribution stays constant)
                                 const nominalPMT = PMT * cumulativeInflation;
                                 simBal = simBal * (1 + annualReturn) + nominalPMT;

                                 // Fix 2: check within ±2 year window at ≥95% of goal
                                 const realBal = simBal / cumulativeInflation;
                                 const yearsFromTarget = Math.abs(year - targetYear);
                                 if (!hitGoal && yearsFromTarget <= 2 && realBal >= goalThreshold) {
                                     hitGoal = true;
                                 }
                             }

                             // Deflate to real (today's) dollars for chart percentile bands
                             const realBal = simBal / cumulativeInflation;
                             if (!yearStats[year]) yearStats[year] = [];
                             yearStats[year].push(Math.max(0, realBal));
                         }

                         if (showDrawdown) {
                             if (survived) successCount++;
                         } else {
                             if (hitGoal) successCount++;
                         }
                     }

                     successRate = (successCount / iterations) * 100;

                     monteCarloPoints.push({ year: currentYear, p20: P, p50: P, p80: P });
                     for (let y = currentYear + 1; y <= currentYear + simYears; y++) {
                         const vals = yearStats[y];
                         if (vals) {
                             vals.sort((a,b) => a - b);
                             monteCarloPoints.push({
                                 year: y,
                                 p20: vals[Math.floor(vals.length * 0.2)],
                                 p50: vals[Math.floor(vals.length * 0.5)],
                                 p80: vals[Math.floor(vals.length * 0.8)]
                             });
                         }
                     }

                     const finalYearStats = showDrawdown ? yearStats[currentYear + simYears] : yearStats[targetYear];
                     if (finalYearStats) {
                         finalYearStats.sort((a,b) => a-b);
                         medianOutcome   = finalYearStats[Math.floor(finalYearStats.length * 0.5)];
                         safeOutcome     = finalYearStats[Math.floor(finalYearStats.length * 0.2)];
                         optimisticOutcome = finalYearStats[Math.floor(finalYearStats.length * 0.8)];
                     }
                }
                
                let maxGraphVal = 0;
                if (viewMode === 'simulation') {
                     maxGraphVal = Math.max(target * 1.1, ...monteCarloPoints.map(p => p.p80));
                } else {
                     maxGraphVal = Math.max(target * 1.1, ...graphPoints.map(p => Math.max(p.ideal || 0, p.projected || 0)));
                }

                return { 
                    projectedValue: fvAtTargetDate, 
                    isOnTrack: fvAtTargetDate >= target, 
                    requiredMonthly: requiredMonthlyReal, 
                    financialProgress, 
                    projectedYearReached: projectedYearReachedStr,
                    statusLabel, statusColor, statusIcon,
                    graphPoints, maxGraphVal,
                    monteCarloPoints, successRate, medianOutcome, safeOutcome, optimisticOutcome, retirementGoal: target,
                    isLifecycleSuccess: graphPoints.length > 0 ? graphPoints[graphPoints.length-1].projected > 0 : false
                };
            }, [currentNestEgg, data, viewMode, showDrawdown, spendableMetrics.taxDragRatio]); 

            const simulationInsight = useMemo(() => {
                if (viewMode !== 'simulation') return null;
                const { successRate, safeOutcome, medianOutcome, retirementGoal } = forecastResults;
                const safeShort = formatShort(safeOutcome);
                const medianShort = formatShort(medianOutcome);
                const goalShort = formatShort(retirementGoal);
                
                if (showDrawdown) {
                    // Fix 3: recalibrated thresholds — 85/70/50 instead of 95/80/50
                    if (successRate >= 85) return { title: "Strong Plan", color: "text-emerald-700 bg-emerald-50 border-emerald-100", text: `In ${successRate.toFixed(1)}% of market simulations your portfolio sustains your spending for the full ${data.retirementDuration} years. This is a well-funded retirement plan.` };
                    if (successRate >= 70) return { title: "Solid Plan", color: "text-blue-700 bg-blue-50 border-blue-100", text: `Your plan succeeds in ${successRate.toFixed(1)}% of scenarios, with a median portfolio of ${medianShort} at end of retirement. Some flexibility in spending during prolonged downturns would further strengthen it.` };
                    if (successRate >= 50) return { title: "Needs Attention", color: "text-amber-700 bg-amber-50 border-amber-100", text: `Your plan runs short in ${(100 - successRate).toFixed(1)}% of scenarios before year ${data.retirementDuration}. Consider increasing savings, reducing spending, or delaying retirement.` };
                    return { title: "Structural Gap", color: "text-rose-700 bg-rose-50 border-rose-100", text: `Your current spending significantly exceeds what your portfolio can reliably support across most market scenarios. A meaningful change to savings or spending is needed.` };
                } else {
                    // Fix 3: recalibrated thresholds — 85/70/50 instead of 95/80/50
                    if (successRate >= 85) return { title: "Goal Well Secured", color: "text-emerald-700 bg-emerald-50 border-emerald-100", text: `You have an ${successRate.toFixed(1)}% probability of reaching your ${goalShort} goal by ${data.retirementYear}. You are in strong shape.` };
                    if (successRate >= 70) return { title: "On Track", color: "text-blue-700 bg-blue-50 border-blue-100", text: `You have a ${successRate.toFixed(1)}% chance of reaching your ${goalShort} goal. This is a solid outlook — small increases to contributions would push you into the strong range.` };
                    if (successRate >= 50) return { title: "Needs Attention", color: "text-amber-700 bg-amber-50 border-amber-100", text: `You have a ${successRate.toFixed(1)}% chance of hitting your ${goalShort} goal by ${data.retirementYear}. Increasing contributions or extending your timeline would meaningfully improve your odds.` };
                    return { title: "Shortfall Likely", color: "text-rose-700 bg-rose-50 border-rose-100", text: `Less than half of simulated market scenarios result in reaching ${goalShort} by ${data.retirementYear}. Review your goal, timeline, or contribution rate.` };
                }
            }, [forecastResults, viewMode, showDrawdown, data.retirementDuration, data.retirementYear, data.retirementGoal]);

            const handleNumericInput = (field, val, isNoFormat = false) => {
                if (val === "" || val === "-" || val.endsWith(".")) {
                    setData(prev => ({ ...prev, [field]: val }));
                    return;
                }
                if (isNoFormat || ['estPreRetirementReturn','estPostRetirementReturn','estInflation','estIncomeTax','estCapGainsTax','retirementDuration','safeWithdrawalRate'].includes(field)) {
                   const num = parseFloat(val);
                   setData(prev => ({ ...prev, [field]: isNaN(num) ? 0 : num }));
                   return;
                }
                const num = parseFloat(val.replace(/[^0-9.-]+/g, ""));
                setData(prev => ({ ...prev, [field]: isNaN(num) ? 0 : num }));
            };

            const updateAccount = (yearId, accountId, field, value) => {
                const isText = ['name', 'type', 'rothSplit'].includes(field);
                let valToStore = value;
                
                if (!isText) {
                     if (value === "" || value === "-" || value.endsWith(".")) {
                          valToStore = value; 
                     } else {
                          valToStore = parseFloat(value);
                          if (isNaN(valToStore)) valToStore = 0;
                     }
                }

                setData(prev => ({
                    ...prev,
                    years: prev.years.map(y => y.id === yearId ? {
                        ...y,
                        accounts: y.accounts.map(a => a.id === accountId ? { 
                            ...a, 
                            [field]: valToStore
                        } : a)
                    } : y)
                }));
            };

            const deleteAccount = (yearId, accountId) => {
                const year = data.years.find(y => y.id === yearId);
                const accountIndex = year?.accounts.findIndex(a => a.id === accountId);
                const account = year?.accounts[accountIndex];
                setConfirmingDelete(null);
                setData(prev => ({
                    ...prev,
                    years: prev.years.map(y => y.id === yearId ? {
                        ...y,
                        accounts: y.accounts.filter(a => a.id !== accountId)
                    } : y)
                }));
                setDeletedAccount({ yearId, account, accountIndex });
                if (undoTimerRef.current) clearTimeout(undoTimerRef.current);
                undoTimerRef.current = setTimeout(() => setDeletedAccount(null), 5000);
            };

            const undoDelete = () => {
                if (!deletedAccount) return;
                const { yearId, account, accountIndex } = deletedAccount;
                setData(prev => ({
                    ...prev,
                    years: prev.years.map(y => y.id === yearId ? {
                        ...y,
                        accounts: [
                            ...y.accounts.slice(0, accountIndex),
                            account,
                            ...y.accounts.slice(accountIndex)
                        ]
                    } : y)
                }));
                if (undoTimerRef.current) clearTimeout(undoTimerRef.current);
                setDeletedAccount(null);
            };

            const addYear = () => {
                const sorted = [...data.years].sort((a, b) => Number(b.year) - Number(a.year));
                const lastYear = sorted[0]?.year || 2024;
                const nextId = Math.random().toString(36).substr(2, 9);
                const newYear = {
                    id: nextId,
                    year: Number(lastYear) + 1,
                    inflationRate: 2.5,
                    grossIncome: 0,
                    accounts: (sorted[0]?.accounts || []).map(a => ({
                        ...a,
                        id: Math.random().toString(36).substr(2, 9),
                        begBalance: a.endBalance,
                        persContrib: 0,
                        empContrib: 0,
                        endBalance: a.endBalance,
                        type: a.type || 'Pre-Tax',
                        rothSplit: a.rothSplit || 0
                    }))
                };
                setData(prev => ({ ...prev, years: [...prev.years, newYear] }));
                setExpandedYears(prev => ({ ...prev, [nextId]: true }));
            };

            const exportData = () => {
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `wealthpulse_data_${new Date().toISOString().split('T')[0]}.json`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const importData = (event) => {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const importedData = JSON.parse(e.target.result);
                        setData(prev => ({
                            ...prev,
                            ...importedData,
                            estPreRetirementReturn: importedData.estPreRetirementReturn !== undefined ? importedData.estPreRetirementReturn : (importedData.estNominalReturn || 7.0),
                            estPostRetirementReturn: importedData.estPostRetirementReturn !== undefined ? importedData.estPostRetirementReturn : 5.0,
                            annualRetirementSpend: importedData.annualRetirementSpend !== undefined ? importedData.annualRetirementSpend : 80000,
                            annualRetirementIncome: importedData.annualRetirementIncome !== undefined ? importedData.annualRetirementIncome : 30000,
                            retirementDuration: importedData.retirementDuration !== undefined ? importedData.retirementDuration : 30,
                            safeWithdrawalRate: importedData.safeWithdrawalRate !== undefined ? importedData.safeWithdrawalRate : 4.0,
                            years: (importedData.years || []).map(y => ({
                                ...y,
                                accounts: (y.accounts || []).map(a => ({
                                    ...a,
                                    type: a.type || 'Pre-Tax',
                                    rothSplit: a.rothSplit || 0
                                }))
                            }))
                        }));
                    } catch (err) {
                        alert("Invalid file format.");
                    }
                };
                reader.readAsText(file);
                event.target.value = '';
            };

            const handleGraphHover = (e) => {
                const svg = e.currentTarget.parentElement;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                
                const effectiveX = x - 64; 
                const effectiveWidth = rect.width - 72; 
                
                if (effectiveX < 0 || effectiveX > effectiveWidth) return;

                if (viewMode === 'simulation') {
                     const pointCount = forecastResults.monteCarloPoints.length;
                    if (pointCount < 2) return;
                    const scale = (pointCount - 1) / effectiveWidth;
                    const index = Math.round(effectiveX * scale);
                    if (index >= 0 && index < pointCount) setHoveredNode(forecastResults.monteCarloPoints[index]);
                } else {
                    const pointCount = forecastResults.graphPoints.length;
                    if (pointCount < 2) return;
                    const scale = (pointCount - 1) / effectiveWidth;
                    const index = Math.round(effectiveX * scale);
                    if (index >= 0 && index < pointCount) setHoveredNode(forecastResults.graphPoints[index]);
                }
            };

            const handleHistGraphHover = (e) => {
                const svg = e.currentTarget.parentElement;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                
                const effectiveX = x - 64; 
                const effectiveWidth = rect.width - 72; 
                
                if (effectiveX < 0 || effectiveX > effectiveWidth) return;

                const pointCount = historicalChartData.length;
                if (pointCount < 2) return;
                const scale = (pointCount - 1) / effectiveWidth;
                const index = Math.round(effectiveX * scale);
                if (index >= 0 && index < pointCount) setHoveredHistNode(historicalChartData[index]);
            };

            return (
                <div className="max-w-[1200px] mx-auto px-4 py-8">
                    {/* Header */}
                    <header className="mb-6 flex flex-col md:flex-row justify-between items-start gap-4">
                        <div>
                            <div className="flex items-center gap-3 mb-1">
                                <div className="bg-slate-900 p-2 rounded-lg text-white shadow-lg">
                                    <Icon name="BarChart3" size={24} />
                                </div>
                                <h1 className="text-2xl font-black tracking-tight text-slate-900">WealthPulse <span className="text-blue-600">Local</span></h1>
                            </div>
                            <p className="text-slate-500 text-sm font-medium">Standalone Portfolio Performance Ledger</p>
                        </div>
                        <div className="flex flex-wrap items-center gap-2 md:self-end">

                            <div className="flex items-center bg-white border border-slate-200 rounded-full px-1 py-1 shadow-sm">
                                <button onClick={exportData} className="flex items-center gap-2 px-4 py-1.5 hover:bg-slate-50 rounded-full text-[11px] font-black text-slate-800 transition-colors">
                                    <Icon name="Download" size={14} className="text-blue-600" /> Backup
                                </button>
                                <div className="w-px h-4 bg-slate-200 mx-1" />
                                <button onClick={() => fileInputRef.current.click()} className="flex items-center gap-2 px-4 py-1.5 hover:bg-slate-50 rounded-full text-[11px] font-black text-slate-800 transition-colors">
                                    <Icon name="Upload" size={14} className="text-indigo-600" /> Load
                                </button>
                                <input type="file" ref={fileInputRef} className="hidden" accept=".json" onChange={importData} />
                            </div>
                        </div>
                    </header>

                    {/* Projection Parameters */}
                    <div className="mb-8">
                        <div className="bg-blue-50/50 p-6 rounded-2xl border border-blue-100 shadow-sm relative">
                             <div className="flex justify-between items-start mb-4">
                                 <h2 className="text-xs font-black text-slate-400 uppercase tracking-widest flex items-center gap-2">
                                    <Icon name="Sliders" size={14} className="text-blue-500" /> Projection Parameters
                                </h2>
                                {/* Plan Drawdown Toggle */}
                                <div className="flex items-center gap-2">
                                    <span className={`text-[10px] font-bold uppercase tracking-wide transition-colors ${showDrawdown ? 'text-indigo-600' : 'text-slate-400'}`}>
                                        Plan Drawdown
                                    </span>
                                    <div className="relative inline-block w-8 h-4 align-middle select-none transition duration-200 ease-in">
                                        <input 
                                            type="checkbox" 
                                            name="toggle" 
                                            id="toggle" 
                                            className="toggle-checkbox absolute block w-4 h-4 rounded-full bg-white border-2 border-slate-300 appearance-none cursor-pointer transition-all duration-300"
                                            checked={showDrawdown}
                                            onChange={() => setShowDrawdown(!showDrawdown)}
                                        />
                                        <label htmlFor="toggle" className={`toggle-label block overflow-hidden h-4 rounded-full cursor-pointer transition-colors duration-300 ${showDrawdown ? 'bg-indigo-500' : 'bg-slate-300'}`}></label>
                                    </div>
                                </div>
                             </div>
                            
                            <div className={`grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 ${showDrawdown ? 'lg:grid-cols-5' : 'lg:grid-cols-6'} gap-4 transition-all`}>
                                {/* Base Params */}
                                <div className="flex flex-col gap-1">
                                    <label className="text-[10px] font-black uppercase text-slate-500 flex items-center">Target Nest Egg<Tooltip text="Enter in today's dollars. The model inflates this target internally — you don't need to adjust for future prices." /></label>
                                    <div className="flex items-center gap-1 bg-white p-2 rounded-xl border border-blue-100 shadow-sm">
                                        <span className="font-bold text-slate-400">$</span>
                                        <input type="text" value={formatNum(data.retirementGoal)} onChange={(e) => handleNumericInput('retirementGoal', e.target.value)} className="bg-transparent border-none focus:ring-0 p-0 font-black text-base text-slate-800 w-full" />
                                    </div>
                                </div>
                                <div className="flex flex-col gap-1">
                                    <label className="text-[10px] font-black uppercase text-slate-500 flex items-center">Retirement Year<Tooltip text="The year you plan to stop working. The model projects forward from today to this date." /></label>
                                    <div className="flex items-center gap-1 bg-white p-2 rounded-xl border border-blue-100 shadow-sm">
                                        <Icon name="Calendar" size={14} className="text-slate-400" />
                                        <input type="text" value={formatRaw(data.retirementYear)} onChange={(e) => handleNumericInput('retirementYear', e.target.value, true)} className="bg-transparent border-none focus:ring-0 p-0 font-black text-base text-slate-800 w-full" />
                                    </div>
                                </div>
                                <div className="flex flex-col gap-1">
                                    <label className="text-[10px] font-black uppercase text-slate-500 flex items-center">Monthly Contribution<Tooltip text="Used in the forward projection as your expected ongoing monthly savings, in today's dollars. The simulation grows this with inflation each year." /></label>
                                    <div className="flex items-center gap-1 bg-white p-2 rounded-xl border border-blue-100 shadow-sm">
                                        <span className="font-bold text-slate-400">$</span>
                                        <input type="text" value={formatNum(data.monthlyContrib)} onChange={(e) => handleNumericInput('monthlyContrib', e.target.value)} className="bg-transparent border-none focus:ring-0 p-0 font-black text-base text-slate-800 w-full" />
                                    </div>
                                </div>
                                <div className="flex flex-col gap-1">
                                    <label className="text-[10px] font-black uppercase text-slate-500 flex items-center">Current Balance<Tooltip text="Auto-filled from your latest ledger year. Override here to test scenarios without changing your ledger data." /></label>
                                    <div className="flex items-center gap-1 bg-white p-2 rounded-xl border border-blue-100 shadow-sm">
                                        <span className="font-bold text-slate-400">$</span>
                                        <input type="text" value={formatNum(currentNestEgg)} onChange={(e) => handleNumericInput('manualNestEgg', e.target.value)} className="bg-transparent border-none focus:ring-0 p-0 font-black text-base text-slate-800 w-full" />
                                    </div>
                                </div>
                                <div className="flex flex-col gap-1">
                                    <label className="text-[10px] font-black uppercase text-slate-500 flex items-center">Pre-Ret Return<Tooltip text="Expected average annual nominal return before retirement. Historical US stock market average is ~10%; a balanced portfolio is typically 6–8%." /></label>
                                    <div className="flex items-center gap-1 bg-white p-2 rounded-xl border border-blue-100 shadow-sm">
                                        <input type="text" value={formatRaw(data.estPreRetirementReturn)} onChange={(e) => handleNumericInput('estPreRetirementReturn', e.target.value, true)} className="bg-transparent border-none focus:ring-0 p-0 font-black text-base text-slate-800 w-full" />
