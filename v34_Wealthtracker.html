                                </div>
                                <div className={`text-sm font-bold mt-1 opacity-80 ${lifetimeMetrics.avgRealReturn >= 0 ? 'text-emerald-600' : 'text-rose-600'}`}>
                                    {(lifetimeMetrics.avgNominalReturn * 100).toFixed(2)}% <span className="text-[10px] uppercase">Nominal</span>
                                </div>
                            </div>
                            <div className="bg-amber-50 border border-amber-100 p-5 rounded-3xl shadow-sm relative">
                                <div className="text-[10px] font-black text-amber-500 uppercase tracking-widest mb-2 flex justify-between items-center">
                                    Historical Inflation
                                    <select 
                                        className="bg-amber-100 text-[9px] rounded px-1 py-0.5 border-none focus:ring-0 text-amber-800 font-bold"
                                        value={inflationBaseYear || ''}
                                        onChange={(e) => setInflationBaseYear(e.target.value)}
                                    >
                                        <option value="">Start</option>
                                        {[...data.years].sort((a,b) => b.year - a.year).map(y => (
                                            <option key={y.id} value={y.year}>{y.year}</option>
                                        ))}
                                    </select>
                                </div>
                                <div className="text-2xl font-black text-amber-700">
                                    {((lifetimeMetrics.avgInflation || 0) * 100).toFixed(2)}% <span className="text-xs font-bold text-amber-500/60">Avg Annual</span>
                                </div>
                                <div className="mt-1 text-[10px] font-bold text-amber-600/80 uppercase tracking-tight">
                                    Total since {lifetimeMetrics.baseYear}: {(lifetimeMetrics.totalCumulativeInflation * 100).toFixed(1)}%
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Ledger Header */}
                    <div className="flex justify-between items-center mb-4">
                        <div className="flex items-center gap-4">
                             <h2 className="text-xs font-black text-slate-400 uppercase tracking-widest flex items-center gap-2"><Icon name="Calendar" size={14} /> Annual Portfolio Ledger</h2>
                        </div>
                        <div className="flex gap-2">
                             <button onClick={() => setExpandedYears({})} className="bg-white hover:bg-slate-600 text-slate-600 px-4 py-2 rounded-lg text-xs font-black border border-slate-200 shadow-sm flex items-center gap-2">
                                <Icon name="Minus" size={14} /> Collapse All
                            </button>
                            <button onClick={addYear} className="bg-slate-900 hover:bg-slate-800 text-white px-4 py-2 rounded-lg text-xs font-black flex items-center gap-2 shadow-md">
                                <Icon name="Plus" size={16} /> Log Year
                            </button>
                        </div>
                    </div>

                    {/* Annual List */}
                    <div className="space-y-4">
                        {processedYearData.map((yearData) => {
                            const { metrics } = yearData;
                            const isExpanded = expandedYears[yearData.id];
                            return (
                                <div key={yearData.id} className="relative">
                                    <div className="absolute right-0 top-0 h-full flex items-start pt-2 pr-2 z-20 pointer-events-none">
                                        <button 
                                            type="button"
                                            onClick={(e) => {
                                                e.preventDefault();
                                                e.stopPropagation();
                                                if (confirm(`Permanently delete the entire log for year ${yearData.year}?`)) {
                                                    setData(prev => ({ ...prev, years: prev.years.filter(y => y.id !== yearData.id) }));
                                                }
                                            }} 
                                            className="pointer-events-auto p-3 text-slate-300 hover:text-white hover:bg-rose-500 bg-white border border-slate-200 rounded-xl transition-all shadow-sm flex items-center justify-center h-[50px] w-[50px] group"
                                            title={`Delete ${yearData.year}`}
                                        >
                                            <Icon name="Trash2" size={20} className="group-hover:scale-110 transition-transform" />
                                        </button>
                                    </div>
                                    <div className={`mr-14 bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden transition-all ${isExpanded ? 'ring-2 ring-blue-100 ring-offset-2' : ''}`}>
                                    <div onClick={() => setExpandedYears(p => ({ ...p, [yearData.id]: !isExpanded }))} className="p-4 cursor-pointer hover:bg-slate-50 flex items-center gap-4 relative bg-white z-10">
                                        <Icon name={isExpanded ? "ChevronUp" : "ChevronDown"} size={20} className="text-slate-400" />
                                        <div className="flex flex-col">
                                            <input 
                                                type="number"
                                                value={yearData.year}
                                                onClick={(e) => e.stopPropagation()}
                                                onChange={(e) => {
                                                    const val = e.target.value;
                                                    setData(prev => ({
                                                        ...prev,
                                                        years: prev.years.map(y => y.id === yearData.id ? { ...y, year: val === "" ? 0 : parseFloat(val) || 0 } : y)
                                                    }));
                                                }}
                                                className="text-xl font-black text-slate-800 bg-transparent border-none focus:ring-0 p-0 w-20"
                                            />
                                        </div>
                                        
                                        <div className="flex-1 grid grid-cols-2 md:grid-cols-5 gap-2 text-sm font-bold">
                                            <div className="flex flex-col flex h-full justify-between bg-blue-50 rounded-lg px-2 py-1.5 border border-blue-100">
                                                <span className="text-[11px] text-blue-400 uppercase tracking-tight">Total Contributions</span>
                                                <span className="text-blue-700 text-lg font-black leading-tight">{formatCurrency(metrics.totalSaved)}</span>
                                            </div>
                                            <div className={`flex flex-col flex h-full justify-between rounded-lg px-2 py-1.5 border ${metrics.marketGrowth >= 0 ? 'bg-emerald-50 border-emerald-100' : 'bg-rose-50 border-rose-100'}`}>
                                                <span className={`text-[11px] uppercase tracking-tight ${metrics.marketGrowth >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>Market Gain</span>
                                                <span className={`text-lg font-black leading-tight ${metrics.marketGrowth >= 0 ? 'text-emerald-700' : 'text-rose-700'}`}>{formatCurrency(metrics.marketGrowth)}</span>
                                            </div>
                                            
                                            <div className={`flex flex-col flex h-full justify-between rounded-lg px-2 py-1.5 border ${metrics.realReturn >= 0 ? 'bg-emerald-50 border-emerald-100' : 'bg-rose-50 border-rose-100'}`}>
                                                <span className={`text-[11px] uppercase tracking-tight ${metrics.realReturn >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>Real Return</span>
                                                <div className="flex items-baseline gap-1.5">
                                                    <span className={`text-lg font-black leading-tight ${metrics.realReturn >= 0 ? 'text-emerald-700' : 'text-rose-700'}`}>{(metrics.realReturn * 100).toFixed(2)}%</span>
                                                    <span className={`text-[10px] font-bold ${metrics.nominalReturn >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>{metrics.nominalReturn >= 0 ? '+' : ''}{(metrics.nominalReturn * 100).toFixed(2)}% nominal</span>
                                                </div>
                                            </div>

                                            <div className="flex flex-col flex h-full justify-between bg-cyan-50 rounded-lg px-2 py-1.5 border border-cyan-100">
                                                <span className="text-[11px] text-cyan-500 uppercase tracking-tight">Savings Rate</span>
                                                <span className="text-cyan-700 text-lg font-black leading-tight">{metrics.savingsRate.toFixed(1)}%</span>
                                            </div>

                                            <div className="flex flex-col flex h-full justify-between bg-slate-50 rounded-lg px-2 py-1.5 border border-slate-100">
                                                <span className="text-[11px] text-slate-400 uppercase tracking-tight">End Total</span>
                                                <span className="text-slate-900 text-lg font-black leading-tight">{formatCurrency(metrics.totalEnd)}</span>
                                            </div>
                                        </div>
                                    </div>
                                    {isExpanded && (
                                        <div className="p-4 bg-slate-50/50 border-t border-slate-100 overflow-x-auto relative z-0">
                                            <div className="mb-4 flex items-center gap-4 w-full">
                                                <div className="flex items-center gap-2 bg-white p-2 rounded-xl border border-slate-200">
                                                    <label className="text-[10px] font-black text-slate-400 uppercase">Annual Inflation</label>
                                                    <div className="flex items-center gap-1 bg-slate-50 px-2 py-1 rounded-lg border border-slate-100">
                                                        <input 
                                                            type="text"
                                                            value={yearData.inflationRate === 0 && yearData.inflationRate !== null ? "" : formatRaw(yearData.inflationRate)}
                                                            placeholder="0.0"
                                                            onChange={(e) => {
                                                                const val = e.target.value;
                                                                if (val === "" || val === "-" || val.endsWith(".")) {
                                                                    updateYearData(yearData.id, 'inflationRate', val);
                                                                } else {
                                                                    const num = parseFloat(val);
                                                                    updateYearData(yearData.id, 'inflationRate', isNaN(num) ? 0 : num);
                                                                }
                                                            }}
                                                            className="w-8 text-sm font-black bg-transparent border-none focus:ring-0 p-0 text-slate-800"
                                                        />
                                                        <span className="text-xs font-bold text-slate-400">%</span>
                                                    </div>
                                                </div>
                                                
                                                <div className="flex items-center gap-2 bg-white p-2 rounded-xl border border-slate-200">
                                                    <label className="text-[10px] font-black text-slate-400 uppercase">Gross Income</label>
                                                    <div className="flex items-center gap-1 bg-slate-50 px-2 py-1 rounded-lg border border-slate-100">
                                                        <span className="text-xs font-bold text-slate-400">$</span>
                                                        <input 
                                                            type="text"
                                                            value={yearData.grossIncome === 0 ? "" : formatNum(yearData.grossIncome)}
                                                            placeholder="0"
                                                            onChange={(e) => {
                                                                const val = e.target.value.replace(/[^0-9.-]+/g, "");
                                                                updateYearData(yearData.id, 'grossIncome', val === "" ? 0 : parseFloat(val));
                                                            }}
                                                            className="w-24 text-sm font-black bg-transparent border-none focus:ring-0 p-0 text-slate-800"
                                                        />
                                                    </div>
                                                </div>
                                            </div>

                                            <table className="w-full text-[11px] min-w-[800px]">
                                                <thead>
                                                    <tr className="text-slate-400 uppercase font-black text-[9px] border-b border-slate-200">
                                                        <th className="text-left pb-2 w-1/6">Account Name</th>
                                                        <th className="text-left pb-2 w-28">Type</th>
                                                        <th className="text-left pb-2 w-28">Beg Bal</th>
                                                        <th className="text-left pb-2 w-28 text-slate-900">End Bal</th>
                                                        <th className="text-left pb-2 w-28 text-blue-600">Personal</th>
                                                        <th className="text-left pb-2 w-28 text-indigo-600">Employer</th>
                                                        <th className="text-right pb-2 w-28">Gain/Loss</th>
                                                        <th className="text-right pb-2 w-20">Nominal</th>
                                                        <th className="text-right pb-2 w-20">Real</th>
                                                        <th className="w-10"></th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {yearData.accounts.map(acc => {
                                                        const accountSaved = acc.persContrib + acc.empContrib;
                                                        const accountGain = acc.endBalance - (acc.begBalance + accountSaved);
                                                        const accountNominal = (acc.begBalance + (accountSaved / 2)) === 0 ? 0 : accountGain / (acc.begBalance + (accountSaved / 2));
                                                        const accountReal = ((1 + accountNominal) / (1 + (yearData.inflationRate / 100))) - 1;

                                                        return (
                                                            <tr key={acc.id} className="border-b border-slate-100 group">
                                                                <td className="py-2">
                                                                    <input 
                                                                        className="bg-transparent font-bold border-none focus:ring-0 p-0 w-full"
                                                                        value={acc.name}
                                                                        onChange={(e) => updateAccount(yearData.id, acc.id, 'name', e.target.value)}
                                                                    />
                                                                </td>
                                                                <td className="py-2">
                                                                    <div className="flex gap-2 items-center">
                                                                        <select
                                                                            className="bg-transparent font-bold text-slate-500 border-none focus:ring-0 p-0 w-full text-[10px]"
                                                                            value={acc.type || 'Pre-Tax'}
                                                                            onChange={(e) => updateAccount(yearData.id, acc.id, 'type', e.target.value)}
                                                                        >
                                                                            <option value="Pre-Tax">Pre-Tax</option>
                                                                            <option value="Roth">Roth</option>
                                                                            <option value="Taxable">Taxable</option>
                                                                            <option value="Hybrid">Hybrid</option>
                                                                            <option value="Real Estate">Real Estate</option>
                                                                        </select>
                                                                        {acc.type === 'Hybrid' && (
                                                                            <div className="flex items-center gap-0.5 bg-slate-100 px-1 rounded">
                                                                                <input
                                                                                    type="text"
                                                                                    className="bg-transparent w-6 text-[10px] font-bold text-center p-0 border-none focus:ring-0"
                                                                                    placeholder="50"
                                                                                    value={acc.rothSplit || 0}
                                                                                    onChange={(e) => updateAccount(yearData.id, acc.id, 'rothSplit', e.target.value)}
                                                                                />
                                                                                <span className="text-[8px] text-slate-400">%R</span>
                                                                            </div>
                                                                        )}
                                                                    </div>
                                                                </td>
                                                                <td className="py-2 text-left">
                                                                    <div className="currency-input-wrapper justify-start w-full">
                                                                        <span>$</span>
                                                                        <input 
                                                                            type="text"
                                                                            className="bg-transparent text-left border-none focus:ring-0 p-0 font-bold w-full"
                                                                            value={formatNum(acc.begBalance)}
                                                                            onChange={(e) => updateAccount(yearData.id, acc.id, 'begBalance', e.target.value.replace(/[^0-9.-]+/g, ""))}
                                                                        />
                                                                    </div>
                                                                </td>
                                                                <td className="py-2 text-left font-black text-slate-900">
                                                                    <div className="currency-input-wrapper justify-start w-full">
                                                                        <span>$</span>
                                                                        <input 
                                                                            type="text"
                                                                            className="bg-transparent text-left border-none focus:ring-0 p-0 font-black w-full"
                                                                            value={formatNum(acc.endBalance)}
                                                                            onChange={(e) => updateAccount(yearData.id, acc.id, 'endBalance', e.target.value.replace(/[^0-9.-]+/g, ""))}
                                                                        />
                                                                    </div>
                                                                </td>
                                                                <td className="py-2 text-left text-blue-600">
                                                                    <div className="currency-input-wrapper justify-start w-full">
                                                                        <span>$</span>
                                                                        <input 
                                                                            type="text"
                                                                            className="bg-transparent text-left border-none focus:ring-0 p-0 font-bold w-full text-blue-600"
                                                                            value={formatNum(acc.persContrib)}
                                                                            onChange={(e) => updateAccount(yearData.id, acc.id, 'persContrib', e.target.value.replace(/[^0-9.-]+/g, ""))}
                                                                        />
                                                                    </div>
                                                                </td>
                                                                <td className="py-2 text-left text-indigo-600">
                                                                    <div className="currency-input-wrapper justify-start w-full">
                                                                        <span>$</span>
                                                                        <input 
                                                                            type="text"
                                                                            className="bg-transparent text-left border-none focus:ring-0 p-0 font-bold w-full text-indigo-600"
                                                                            value={formatNum(acc.empContrib)}
                                                                            onChange={(e) => updateAccount(yearData.id, acc.id, 'empContrib', e.target.value.replace(/[^0-9.-]+/g, ""))}
                                                                        />
                                                                    </div>
                                                                </td>
                                                                <td className={`py-2 text-right font-bold ${accountGain >= 0 ? 'text-emerald-600' : 'text-rose-500'}`}>
                                                                    {formatCurrency(accountGain)}
                                                                </td>
                                                                <td className="py-2 text-right text-slate-500">{(accountNominal * 100).toFixed(1)}%</td>
                                                                <td className={`py-2 text-right font-black ${accountReal >= 0 ? 'text-emerald-600' : 'text-rose-600'}`}>
                                                                    {(accountReal * 100).toFixed(1)}%
                                                                </td>
                                                                <td className="py-2 text-center">
                                                                    {confirmingDelete === acc.id ? (
                                                                        <div className="flex items-center gap-1 justify-center">
                                                                            <button
                                                                                onClick={() => deleteAccount(yearData.id, acc.id)}
                                                                                className="px-2 py-0.5 text-[10px] font-black uppercase tracking-wider bg-rose-500 text-white rounded hover:bg-rose-600 transition-colors"
                                                                            >
                                                                                Delete
                                                                            </button>
                                                                            <button
                                                                                onClick={() => setConfirmingDelete(null)}
                                                                                className="px-2 py-0.5 text-[10px] font-black uppercase tracking-wider bg-slate-100 text-slate-500 rounded hover:bg-slate-200 transition-colors"
                                                                            >
                                                                                Cancel
                                                                            </button>
                                                                        </div>
                                                                    ) : (
                                                                        <button
                                                                            onClick={() => setConfirmingDelete(acc.id)}
                                                                            className="p-1 hover:bg-rose-50 text-slate-300 hover:text-rose-500 rounded transition-colors opacity-0 group-hover:opacity-100"
                                                                        >
                                                                            <Icon name="X" size={14} />
                                                                        </button>
                                                                    )}
                                                                </td>
                                                            </tr>
                                                        );
                                                    })}
                                                </tbody>
                                                <tfoot>
                                                    <tr className="border-t-2 border-slate-200 bg-slate-100/50 font-black text-slate-900">
                                                        <td className="py-3 px-2 text-[10px] uppercase">Annual Totals</td>
                                                        <td className="py-3"></td>
                                                        <td className="py-3 text-left pl-2">{formatCurrency(metrics.totalBeg)}</td>
                                                        <td className="py-3 text-left pl-2 font-black">{formatCurrency(metrics.totalEnd)}</td>
                                                        <td className="py-3 text-left pl-2 text-blue-600">{formatCurrency(metrics.totalPers)}</td>
                                                        <td className="py-3 text-left pl-2 text-indigo-600">{formatCurrency(metrics.totalEmp)}</td>
                                                        <td className={`py-3 text-right ${metrics.marketGrowth >= 0 ? 'text-emerald-600' : 'text-rose-500'}`}>
                                                            {formatCurrency(metrics.marketGrowth)}
                                                        </td>
                                                        <td className="py-3 text-right text-slate-600">{(metrics.nominalReturn * 100).toFixed(1)}%</td>
                                                        <td className={`py-3 text-right ${metrics.realReturn >= 0 ? 'text-emerald-600' : 'text-rose-600'}`}>
                                                            {(metrics.realReturn * 100).toFixed(1)}%
                                                        </td>
                                                        <td></td>
                                                    </tr>
                                                </tfoot>
                                            </table>
                                            <div className="mt-4 flex justify-end items-center">
                                                <button 
                                                    onClick={() => {
                                                        setData(prev => ({
                                                            ...prev,
                                                            years: prev.years.map(y => y.id === yearData.id ? {
                                                                ...y,
                                                                accounts: [...y.accounts, { id: Math.random().toString(36).substr(2, 9), name: 'New Account', begBalance: 0, persContrib: 0, empContrib: 0, endBalance: 0, type: 'Pre-Tax' }]
                                                            } : y)
                                                        }));
                                                    }}
                                                    className="text-[10px] font-black uppercase tracking-widest text-blue-600 hover:text-blue-800 flex items-center gap-1"
                                                >
                                                    <Icon name="Plus" size={14} /> Add Account
                                                </button>
                                            </div>
                                        </div>
                                    )}
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    <footer className="mt-auto py-12 text-center text-slate-300 text-[10px] font-black uppercase tracking-[0.2em] bg-slate-50 border-t border-slate-100">
                        WealthPulse Local • Zero Cloud Storage
                    </footer>

                    {/* Undo Toast rendered via portal to escape overflow:hidden ancestors */}
                    {deletedAccount && createPortal(
                        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 flex items-center gap-3 bg-slate-800 text-white px-4 py-3 rounded-xl shadow-xl text-xs font-bold z-50">
                            <Icon name="Trash2" size={14} className="text-slate-400" />
                            <span>Account deleted</span>
                            <button
                                onClick={undoDelete}
                                className="ml-2 px-3 py-1 bg-blue-500 hover:bg-blue-400 text-white text-[10px] font-black uppercase tracking-widest rounded-lg transition-colors"
                            >
                                Undo
                            </button>
                            <button
                                onClick={() => setDeletedAccount(null)}
                                className="text-slate-400 hover:text-white transition-colors"
                            >
                                <Icon name="X" size={12} />
                            </button>
                        </div>,
                        document.body
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
